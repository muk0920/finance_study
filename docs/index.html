<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>은행 필기 상식노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#16201B; --muted:#5A6760; --line:#D5DCD6;
  --accent:#1E6A50; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --fin:#1E6A50; --fin-soft:#DCEBE3;
  --eco:#8E6110; --eco-soft:#F3E7CC;
  --dig:#2D5B9A; --dig-soft:#DCE6F4;
  --ok:#1F7A46; --ok-soft:#DDF0E3; --bad:#B4372E; --bad-soft:#F7DEDA;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","AppleMyungjo","Batang",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#171F1C; --sunk:#1F2925; --ink:#E4EBE7; --muted:#98A69F; --line:#2C3833;
    --accent:#5BC197; --accent-ink:#0F1513; --accent-soft:#1C3A2E;
    --fin:#6CCB9F; --fin-soft:#1C3A2E; --eco:#E0B35A; --eco-soft:#3A2F17; --dig:#86AEE8; --dig-soft:#1D2B42;
    --ok:#6CCB8E; --ok-soft:#173323; --bad:#F08A7E; --bad-soft:#3D1F1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#171F1C; --sunk:#1F2925; --ink:#E4EBE7; --muted:#98A69F; --line:#2C3833;
  --accent:#5BC197; --accent-ink:#0F1513; --accent-soft:#1C3A2E;
  --fin:#6CCB9F; --fin-soft:#1C3A2E; --eco:#E0B35A; --eco-soft:#3A2F17; --dig:#86AEE8; --dig-soft:#1D2B42;
  --ok:#6CCB8E; --ok-soft:#173323; --bad:#F08A7E; --bad-soft:#3D1F1C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding:0 16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.tabs{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.toolbar .left{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1 1 280px}
.search{flex:1 1 220px;max-width:340px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter{width:120px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}100%{}}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px}
.cat-fin{color:var(--fin);background:var(--fin-soft)}
.cat-eco{color:var(--eco);background:var(--eco-soft)}
.cat-dig{color:var(--dig);background:var(--dig-soft)}
.miss{font-size:12px;color:var(--bad)}
.term{font-family:var(--serif);font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.en{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-6px}
.def{margin:0}
.points{margin:0;padding-left:18px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.points li::marker{color:var(--muted)}
.trap{background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:13.5px}
.trap b{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.reveal{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:22px 12px;color:var(--muted);font-size:14px}
.card-foot{margin-top:auto;display:flex;gap:8px;padding-top:4px}
.btn-s{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.btn-s:hover{color:var(--ink);border-color:var(--muted)}
.btn-s.known[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* quiz */
.qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qbar .info{font-size:14px;color:var(--muted)}
.qbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.qtrack{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.qtrack i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.qtext{font-size:18px;font-weight:600;line-height:1.5;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.exp{border-radius:8px;padding:14px 16px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.exp .verdict{font-weight:600}
.exp .verdict.ok{color:var(--ok)}
.exp .verdict.no{color:var(--bad)}
.exp p{margin:0;font-size:14.5px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.score{font-family:var(--serif);font-size:56px;line-height:1}
.score small{font-size:22px;color:var(--muted)}
.wronglist{list-style:none;padding:0;margin:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.wronglist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.wronglist .t{display:flex;gap:8px;align-items:center}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:520px){h1{font-size:26px}.qcard{padding:18px}.qtext{font-size:16.5px}.meter{width:80px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">은행 필기 · 금융 · 경제 · 디지털 상식</p>
      <h1>상식노트</h1>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true">개념 학습</button>
      <button role="tab" id="tab-quiz" aria-selected="false">퀴즈</button>
    </div>
  </header>

  <div class="filters" id="filters"></div>

  <section id="learn">
    <div class="toolbar" style="margin-bottom:14px">
      <div class="left">
        <input id="search" class="search" type="search" placeholder="용어 검색 (예: DSR, 환율)">
        <button id="hide" class="toggle" aria-pressed="false">뜻 가리기</button>
      </div>
      <div class="progress">외운 개념 <span class="num" id="knownCount">0 / 24</span><span class="meter"><i id="knownBar" style="width:0"></i></span></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="quiz" hidden>
    <div class="qbar" style="margin-bottom:12px">
      <div class="info" id="qinfo"></div>
      <div class="acts">
        <button class="btn" id="qWrongOnly">자주 틀린 문제만</button>
        <button class="btn" id="qRestart">새로 섞어서 시작</button>
      </div>
    </div>
    <div class="qtrack" style="margin-bottom:16px"><i id="qtrack" style="width:0"></i></div>
    <div id="qbody"></div>
  </section>

  <footer>문제와 해설은 학습용으로 새로 작성한 예시입니다. 수치와 제도는 2025년 기준이니 시험 전에 최신 내용을 확인하세요.</footer>
</div>

<script>
const CATS = { fin: '금융', eco: '경제', dig: '디지털' };
const DATA = [
  { id:'f1', cat:'fin', term:'BIS 자기자본비율', en:'BIS Capital Adequacy Ratio',
    def:'은행의 자기자본을 위험가중자산으로 나눈 비율. 은행이 손실을 얼마나 견딜 수 있는지 보여주는 건전성 지표다.',
    points:['산식: 자기자본 ÷ 위험가중자산 × 100','바젤Ⅲ 최저 기준: 보통주자본 4.5% · 기본자본 6% · 총자본 8%','자본보전완충자본 2.5%가 추가로 요구된다'],
    trap:'위험가중자산은 분모라서 늘어나면 비율이 내려간다. 기준은 국제결제은행 산하 바젤은행감독위원회(BCBS)가 정한다.',
    quiz:{ q:'BIS 자기자본비율에 대한 설명으로 옳지 않은 것은?',
      o:['바젤은행감독위원회가 정한 은행 건전성 기준이다.','자기자본을 위험가중자산으로 나누어 계산한다.','바젤Ⅲ 기준 최저 총자본비율은 8%이다.','위험가중자산이 늘어나면 BIS 비율도 올라간다.','보통주자본비율의 최저 기준은 4.5%이다.'],
      a:3, exp:'위험가중자산은 분모다. 자기자본이 그대로일 때 위험가중자산이 늘면 BIS 비율은 떨어진다.' } },
  { id:'f2', cat:'fin', term:'예금자보호제도', en:'Deposit Insurance',
    def:'금융회사가 파산 등으로 예금을 돌려줄 수 없을 때 예금보험공사가 대신 지급하는 제도.',
    points:['보호한도: 1인당 금융회사별 원금과 이자를 합쳐 1억 원 (2025년 9월 1일부터, 이전에는 5천만 원)','보호: 보통·정기예금, 적금, 외화예금, 원금보장형 신탁','비보호: 펀드 같은 실적배당형 상품, CD, RP, 은행채, 주택청약종합저축'],
    trap:'주택청약종합저축은 예금보험 대상이 아니다. 대신 주택도시기금 재원이라 정부가 관리한다.',
    quiz:{ q:'예금자보호제도의 보호 대상이 아닌 것은?',
      o:['보통예금','정기적금','외화예금','주택청약종합저축','원금보장형 신탁'],
      a:3, exp:'주택청약종합저축은 예금보험공사의 보호 대상이 아니고 정부가 관리한다. 보호한도는 2025년 9월부터 1인당 금융회사별 1억 원이다.' } },
  { id:'f3', cat:'fin', term:'듀레이션', en:'Duration',
    def:'채권의 현금흐름을 회수하는 데 걸리는 가중평균 기간. 금리 변화에 대한 채권 가격의 민감도를 나타낸다.',
    points:['만기가 길수록 듀레이션이 길다','표면금리가 높을수록, 시장금리가 높을수록 듀레이션이 짧다','무이표채(할인채)의 듀레이션은 만기와 같다'],
    trap:'듀레이션이 길수록 금리 변동에 따른 가격 변동폭이 크다. 금리 상승이 예상되면 듀레이션을 줄인다.',
    quiz:{ q:'채권의 듀레이션에 대한 설명으로 옳은 것은?',
      o:['표면금리가 높을수록 듀레이션은 길어진다.','만기가 길수록 듀레이션은 짧아진다.','무이표채(할인채)의 듀레이션은 만기와 같다.','듀레이션이 길수록 금리 변화에 따른 가격 변동이 작다.','시장금리가 오르면 듀레이션은 길어진다.'],
      a:2, exp:'할인채는 중간에 받는 이자가 없어 만기에 한 번에 회수하므로 듀레이션이 만기와 같다. 표면금리나 시장금리가 높으면 듀레이션은 짧아지고, 듀레이션이 길수록 가격 변동은 커진다.' } },
  { id:'f4', cat:'fin', term:'기준금리', en:'Base Rate',
    def:'한국은행이 금융기관과 거래할 때 기준이 되는 정책금리. 시중 금리 전반에 영향을 준다.',
    points:['한국은행 금융통화위원회(7명, 의장은 총재)가 연 8회 결정','7일물 RP 매각 시 고정입찰금리로 쓰인다','인상하면 대출 감소, 물가 안정, 원화 강세 압력으로 이어진다'],
    trap:'결정 주체는 기획재정부가 아니라 한국은행 금융통화위원회다.',
    quiz:{ q:'우리나라 기준금리에 대한 설명으로 옳지 않은 것은?',
      o:['한국은행 금융통화위원회가 결정한다.','기준금리 결정 회의는 연 8회 열린다.','기획재정부 장관이 최종 승인해야 효력이 생긴다.','7일물 RP 매각 시 고정입찰금리로 쓰인다.','금융통화위원회 의장은 한국은행 총재가 맡는다.'],
      a:2, exp:'기준금리는 한국은행 금융통화위원회가 독립적으로 결정하며 정부의 승인 절차가 없다.' } },
  { id:'f5', cat:'fin', term:'DSR', en:'Debt Service Ratio · 총부채원리금상환비율',
    def:'차주가 가진 모든 대출의 연간 원리금 상환액을 연소득으로 나눈 비율.',
    points:['LTV: 담보가치 대비 대출금 비율','DTI: (주담대 원리금 + 기타대출 이자) ÷ 연소득','DSR: 모든 대출 원리금 ÷ 연소득으로, 셋 중 가장 포괄적이다'],
    trap:'DTI는 기타대출의 이자만, DSR은 기타대출의 원리금까지 반영한다. 미래 금리 상승 위험을 더해 계산하는 스트레스 DSR도 함께 알아두자.',
    quiz:{ q:'주택담보대출뿐 아니라 신용대출, 자동차 할부 등 모든 대출의 원리금 상환액을 연소득과 비교하는 지표는?',
      o:['LTV','DTI','DSR','LCR','RTI'],

    quiz:{ q:'마이데이터에 대한 설명으로 옳은 것은?',
      o:['금융회사가 고객 동의 없이 데이터를 모아 분석하는 서비스다.','개인신용정보 전송요구권에 바탕을 둔다.','근거 법률은 전자금융거래법이다.','스크린 스크래핑 방식을 원칙으로 한다.'],
      a:1, exp:'마이데이터는 정보주체의 전송요구권에 바탕을 두며, 근거법은 신용정보법이고 표준 API 방식이 원칙이다.' } },
  { id:'d3', cat:'dig', term:'오픈뱅킹', en:'Open Banking',
    def:'하나의 앱에서 여러 은행 계좌를 조회하고 이체할 수 있도록 은행의 결제 기능을 표준 API로 개방한 공동 인프라.',
    points:['2019년 12월 전면 시행, 금융결제원이 운영','핀테크 기업, 상호금융, 증권사, 카드사 등으로 참여가 확대되었다','고객 동의를 전제로 한다'],
    trap:'오픈뱅킹은 결제·이체 인프라 개방, 마이데이터는 정보 통합 조회·관리로 구분한다.',
    quiz:{ q:'하나의 앱으로 여러 은행 계좌를 조회·이체할 수 있도록 표준 API로 은행 결제망을 개방한 인프라는?',
      o:['오픈뱅킹','마이데이터','BaaS','간편결제','인터넷전문은행'],
      a:0, exp:'오픈뱅킹이다. 금융결제원이 운영하며 고객 동의를 받아 여러 은행의 조회·이체 기능을 이용한다.' } },
  { id:'d4', cat:'dig', term:'레그테크 · 섭테크', en:'RegTech · SupTech',
    def:'레그테크는 금융회사가 규제 준수 업무를, 섭테크는 금융감독기관이 감독 업무를 IT로 효율화하는 기술이다.',
    points:['RegTech = Regulation + Technology (금융회사가 사용)','SupTech = Supervision + Technology (감독기관이 사용)','예: AI 이상거래 탐지, 자금세탁방지(AML) 모니터링'],
    trap:'누가 사용하는지(금융회사인가, 감독기관인가)로 구분하는 문제가 자주 나온다.',
    quiz:{ q:'금융감독기관이 감독 업무의 효율을 높이기 위해 활용하는 기술을 뜻하는 용어는?',
      o:['레그테크','섭테크','인슈어테크','프롭테크','테크핀'],
      a:1, exp:'섭테크다. 레그테크는 금융회사가 쓰는 규제 준수 기술, 프롭테크는 부동산과 기술의 결합, 테크핀은 IT기업이 주도하는 금융서비스다.' } },
  { id:'d5', cat:'dig', term:'금융규제 샌드박스', en:'Regulatory Sandbox',
    def:'혁신적인 금융서비스가 기존 규제에 막히지 않도록 일정 기간 규제를 면제하거나 유예해 주는 제도.',
    points:['근거법: 금융혁신지원 특별법 (2019년 4월 시행)','금융위원회가 혁신금융서비스로 지정한다','특례 기간: 최대 2년, 1회 연장 시 최대 4년'],
    trap:'아이들이 모래 놀이터(sandbox)에서 마음껏 놀듯, 안전한 범위 안에서 시험해 볼 수 있게 한다는 뜻이다.',
    quiz:{ q:'금융규제 샌드박스에 대한 설명으로 옳지 않은 것은?',
      o:['금융혁신지원 특별법에 근거한다.','금융위원회가 혁신금융서비스를 지정한다.','지정되면 기간 제한 없이 영구적으로 규제가 면제된다.','기존 규제를 일정 기간 면제하거나 유예한다.'],
      a:2, exp:'규제 특례는 기간이 정해져 있다. 최대 2년이고 한 번 연장하면 최대 4년이다.' } },
  { id:'d6', cat:'dig', term:'블록체인', en:'Blockchain · 분산원장기술',
    def:'거래 기록을 블록 단위로 묶어 네트워크 참여자들이 함께 나눠 보관하는 분산원장 기술.',
    points:['중앙 관리자 없이 참여자 간 합의로 거래를 검증한다','해시값으로 블록이 연결되어 위·변조가 어렵다','퍼블릭(누구나 참여)과 프라이빗·컨소시엄(허가된 참여자)으로 나뉜다'],
    trap:'합의 방식: 작업증명(PoW, 비트코인), 지분증명(PoS, 이더리움).',
    quiz:{ q:'블록체인의 특징으로 옳지 않은 것은?',
      o:['거래 기록을 여러 참여자가 분산해 보관한다.','해시값으로 블록이 연결되어 위·변조가 어렵다.','중앙 서버가 모든 거래를 최종 승인한다.','참여 범위에 따라 퍼블릭과 프라이빗으로 나뉜다.'],
      a:2, exp:'블록체인은 중앙 서버 없이 참여자들의 합의로 거래를 검증하는 것이 핵심이다.' } },
  { id:'d7', cat:'dig', term:'스테이블코인', en:'Stablecoin',
    def:'법정화폐나 특정 자산에 가치를 연동해 가격 변동을 줄인 암호자산.',
    points:['법정화폐 담보형 (예: USDT, USDC)','암호자산 담보형, 알고리즘형','2022년 테라·루나 사태: 알고리즘형의 가치 연동이 무너진 사례'],
    trap:'CBDC는 중앙은행이 발행하고, 스테이블코인은 민간이 발행한다.',
    quiz:{ q:'스테이블코인에 대한 설명으로 옳은 것은?',
      o:['중앙은행만 발행할 수 있다.','법정화폐 등에 가치를 연동해 가격 변동을 줄인다.','공급량이 정해져 있어 가격이 계속 오른다.','예금자보호 대상이다.'],
      a:1, exp:'스테이블코인은 민간이 발행하며 달러 같은 자산에 가치를 연동한다. 예금자보호 대상이 아니다.' } },
  { id:'d8', cat:'dig', term:'임베디드 금융', en:'Embedded Finance',
    def:'비금융기업이 자사 플랫폼에 결제, 대출, 보험 같은 금융서비스를 내장해 제공하는 것.',
    points:['예: 쇼핑 앱의 간편결제와 BNPL(선구매 후결제), 자동차 구매 시 보험 가입','금융회사는 BaaS(Banking as a Service)로 인프라를 제공한다','고객은 금융 앱을 따로 열지 않고 서비스 안에서 금융을 이용한다'],
    trap:'BaaS는 금융회사 쪽에서 본 개념, 임베디드 금융은 비금융기업 쪽에서 본 개념이다.',
    quiz:{ q:'쇼핑몰 앱에서 결제할 때 바로 선구매 후결제(BNPL)를 이용할 수 있도록, 비금융기업이 금융서비스를 자사 플랫폼에 내장하는 것은?',
      o:['임베디드 금융','오픈뱅킹','디파이(DeFi)','P2P 금융','마이데이터'],
      a:0, exp:'임베디드 금융이다. 디파이는 블록체인 기반 탈중앙화 금융, P2P 금융은 개인 간 대출 중개다.' } },
];
const BY_ID = Object.fromEntries(DATA.map(d => [d.id, d]));
const MARKS = ['①','②','③','④','⑤'];

// storage (per-viewer convenience only)
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

const state = {
  tab: 'learn', cat: 'all', search: '', hide: false,
  known: new Set(load('bn.known', [])),
  wrong: load('bn.wrong', {}),
  revealed: new Set(),
  quiz: null,
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inCat = d => state.cat === 'all' || d.cat === state.cat;
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------- filters ---------- */
function renderFilters(){
  const opts = [['all','전체',DATA.length], ...Object.entries(CATS).map(([k,v]) => [k, v, DATA.filter(d => d.cat === k).length])];
  $('#filters').innerHTML = opts.map(([k,label,n]) =>
    `<button class="chip" data-cat="${k}" aria-pressed="${state.cat===k}">${label}<span class="n">${n}</span></button>`).join('');
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if(!b) return;
  state.cat = b.dataset.cat; renderFilters();
  if(state.tab === 'learn') renderCards(); else startQuiz(DATA.filter(inCat).map(d => d.id));
});

/* ---------- learn ---------- */
function renderCards(){
  const q = state.search.trim().toLowerCase();
  const list = DATA.filter(d => inCat(d) && (!q || (d.term + d.en + d.def).toLowerCase().includes(q)));
  $('#grid').innerHTML = list.length ? list.map(d => {
    const covered = state.hide && !state.revealed.has(d.id);
    const miss = state.wrong[d.id] ? `<span class="miss">오답 ${state.wrong[d.id]}회</span>` : '';
    const body = covered
      ? `<button class="reveal" data-reveal="${d.id}">눌러서 뜻 보기</button>`
      : `<p class="def">${esc(d.def)}</p>
         <ul class="points">${d.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
         <div class="trap"><b>출제 포인트</b>${esc(d.trap)}</div>`;
    return `<article class="card" id="c-${d.id}">
      <div class="card-top"><span class="cat cat-${d.cat}">${CATS[d.cat]}</span>${miss}</div>
      <h3 class="term">${esc(d.term)}</h3>
      <div class="en">${esc(d.en)}</div>
      ${body}
      <div class="card-foot">
        <button class="btn-s known" data-known="${d.id}" aria-pressed="${state.known.has(d.id)}">${state.known.has(d.id) ? '✓ 외웠어요' : '외웠어요'}</button>
        <button class="btn-s" data-try="${d.id}">이 개념 문제 풀기</button>
      </div>
    </article>`;
  }).join('') : `<p class="empty">"${esc(state.search)}"에 해당하는 개념이 없습니다.</p>`;
  const n = state.known.size;
  $('#knownCount').textContent = `${n} / ${DATA.length}`;
  $('#knownBar').style.width = (n / DATA.length * 100) + '%';
}
$('#grid').addEventListener('click', e => {
  const r = e.target.closest('[data-reveal]'), k = e.target.closest('[data-known]'), t = e.target.closest('[data-try]');
  if(r){ state.revealed.add(r.dataset.reveal); renderCards(); }
  if(k){ const id = k.dataset.known; state.known.has(id) ? state.known.delete(id) : state.known.add(id); save('bn.known', [...state.known]); renderCards(); }
  if(t){ setTab('quiz'); startQuiz([t.dataset.try]); }
});
$('#search').addEventListener('input', e => { state.search = e.target.value; renderCards(); });
$('#hide').addEventListener('click', () => {
  state.hide = !state.hide; state.revealed.clear();
  $('#hide').setAttribute('aria-pressed', state.hide);
  $('#hide').textContent = state.hide ? '뜻 보이기' : '뜻 가리기';
  renderCards();
});

/* ---------- quiz ---------- */
function startQuiz(ids){
  state.quiz = {
    ids: shuffle(ids), i: 0, correct: 0, missed: [],
    orders: {}, picked: null,
  };
  state.quiz.ids.forEach(id => { state.quiz.orders[id] = shuffle(BY_ID[id].quiz.o.map((_, i) => i)); });
  renderQuiz();
}
function renderQuiz(){
  const Q = state.quiz, total = Q.ids.length, done = Q.i >= total;
  const scope = state.cat === 'all' ? '전체' : CATS[state.cat];
  $('#qinfo').innerHTML = done
    ? `${scope} 범위 · 완료`
    : `${total === 1 ? '개념 1문제' : scope + ' 범위'} · <span class="num">${Q.i + 1} / ${total}</span> · 정답 <span class="num">${Q.correct}</span>`;
  $('#qtrack').style.width = ((Q.i + (Q.picked !== null ? 1 : 0)) / total * 100) + '%';
  $('#qWrongOnly').disabled = !Object.keys(state.wrong).some(id => inCat(BY_ID[id]));

  if(done){
    const pct = Math.round(Q.correct / total * 100);
    $('#qbody').innerHTML = `<div class="qcard result">
      <div class="score">${Q.correct}<small> / ${total}</small></div>
      <p style="margin:0">정답률 <span class="num">${pct}%</span>${pct >= 80 ? ' · 잘하고 있어요' : pct >= 50 ? ' · 틀린 개념을 한 번 더 보세요' : ' · 개념 카드부터 다시 훑어보세요'}</p>
      ${Q.missed.length ? `<ul class="wronglist">${Q.missed.map(id => { const d = BY_ID[id];
        return `<li><span class="t"><span class="cat cat-${d.cat}">${CATS[d.cat]}</span>${esc(d.term)}</span><button class="btn-s" data-goto="${id}">개념 보기</button></li>`; }).join('')}</ul>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        ${Q.missed.length ? `<button class="btn primary" data-retry="missed">틀린 ${Q.missed.length}문제 다시 풀기</button>` : ''}
        <button class="btn" data-retry="all">전체 다시 풀기</button>
      </div></div>`;
    return;
  }

  const id = Q.ids[Q.i], d = BY_ID[id], qz = d.quiz, order = Q.orders[id], answered = Q.picked !== null;
  const opts = order.map((orig, pos) => {
    let cls = 'opt';
    if(answered){
      if(orig === qz.a) cls += ' right';
      else if(orig === Q.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return `<li><button class="${cls}" data-pick="${orig}" ${answered ? 'disabled' : ''}><span class="k">${pos + 1}</span><span>${esc(qz.o[orig])}</span></button></li>`;
  }).join('');
  const ok = Q.picked === qz.a;
  const ansPos = order.indexOf(qz.a);
  $('#qbody').innerHTML = `<div class="qcard">
    <div class="qhead"><span class="cat cat-${d.cat}">${CATS[d.cat]}</span><span>Q${Q.i + 1}</span></div>
    <p class="qtext">${esc(qz.q)}</p>
    <ul class="opts">${opts}</ul>
    ${answered ? `<div class="exp">
      <span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '정답입니다' : `오답입니다 · 정답 ${MARKS[ansPos]}`}</span>
      <p>${esc(qz.exp)}</p>
    </div>` : ''}
    <div class="qfoot">
      <span class="hint">${answered ? 'Enter 키로 다음 문제' : '숫자 키 1–' + order.length + '로 선택'}</span>
      <div style="display:flex;gap:8px">
        ${answered ? `<button class="btn" data-goto="${id}">개념 카드 보기</button><button class="btn primary" id="qNext">${Q.i + 1 < total ? '다음 문제' : '결과 보기'}</button>` : ''}
      </div>
    </div></div>`;
}
function pick(orig){
  const Q = state.quiz; if(!Q || Q.picked !== null || Q.i >= Q.ids.length) return;
  const id = Q.ids[Q.i];
  Q.picked = orig;
  if(orig === BY_ID[id].quiz.a){ Q.correct++; }
  else { Q.missed.push(id); state.wrong[id] = (state.wrong[id] || 0) + 1; save('bn.wrong', state.wrong); }
  renderQuiz();
  const nb = $('#qNext'); if(nb) nb.focus({preventScroll:true});
}
function next(){ const Q = state.quiz; if(Q.picked === null) return; Q.i++; Q.picked = null; renderQuiz(); }
function gotoCard(id){
  setTab('learn');
  if(!inCat(BY_ID[id])){ state.cat = 'all'; renderFilters(); }
  state.search = ''; $('#search').value = ''; state.revealed.add(id); renderCards();
  const el = document.getElementById('c-' + id);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
$('#qbody').addEventListener('click', e => {
  const p = e.target.closest('[data-pick]'), g = e.target.closest('[data-goto]'), r = e.target.closest('[data-retry]');
  if(p) pick(+p.dataset.pick);
  if(e.target.closest('#qNext')) next();
  if(g) gotoCard(g.dataset.goto);
  if(r) startQuiz(r.dataset.retry === 'missed' ? state.quiz.missed.slice() : DATA.filter(inCat).map(d => d.id));
});
$('#qRestart').addEventListener('click', () => startQuiz(DATA.filter(inCat).map(d => d.id)));
$('#qWrongOnly').addEventListener('click', () => {
  const ids = Object.keys(state.wrong).filter(id => BY_ID[id] && inCat(BY_ID[id])).sort((a,b) => state.wrong[b] - state.wrong[a]);
  if(ids.length) startQuiz(ids);
});
document.addEventListener('keydown', e => {
  if(state.tab !== 'quiz' || !state.quiz || e.target.matches('input')) return;
  const Q = state.quiz; if(Q.i >= Q.ids.length) return;
  if(Q.picked === null && /^[1-5]$/.test(e.key)){
    const order = Q.orders[Q.ids[Q.i]], pos = +e.key - 1;
    if(pos < order.length) pick(order[pos]);
  } else if(Q.picked !== null && (e.key === 'Enter' || e.key === 'ArrowRight')){
    e.preventDefault(); next();
  }
});

/* ---------- tabs ---------- */
function setTab(t){
  state.tab = t;
  $('#tab-learn').setAttribute('aria-selected', t === 'learn');
  $('#tab-quiz').setAttribute('aria-selected', t === 'quiz');
  $('#learn').hidden = t !== 'learn';
  $('#quiz').hidden = t !== 'quiz';
  if(t === 'learn') renderCards(); else renderQuiz();
  try{ history.replaceState(null, '', '#' + t); }catch(e){}
}
$('#tab-learn').addEventListener('click', () => setTab('learn'));
$('#tab-quiz').addEventListener('click', () => setTab('quiz'));

renderFilters();
startQuiz(DATA.map(d => d.id));
setTab(location.hash === '#quiz' ? 'quiz' : 'learn');
</script>

</body></html>
